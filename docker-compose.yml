# Satu VPS dipakai beberapa anggota kelompok: nama project, image, dan port
# dibedakan agar deploy anggota lain (project cart-api, port 3000) tidak tertimpa.
name: cart-api-ferdy

services:
  api:
    build: .
    image: cart-api-ferdy:latest
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
